      <text x="18" y="361" class="mono" fill="#e24a2a">03 / VERIFY</text>
      <line x1="18" y1="375" x2="478" y2="375" stroke="#1b1b1b"/>
      <rect x="18" y="389" width="20" height="20" fill="#1b1b1b"/>
      <path d="M23 399 l4 4 7-9" fill="none" stroke="#ffffff" stroke-width="2"/>
      <text x="49" y="404" class="small" fill="#1b1b1b">Geometry validated</text>
      <rect x="18" y="423" width="20" height="20" fill="#e24a2a"/>
      <text x="24" y="438" class="mono" fill="#ffffff">4</text>
      <text x="49" y="438" class="small" fill="#1b1b1b">Boundary conditions resolved</text>

      <rect x="18" y="466" width="174" height="38" fill="#fffcf6" stroke="#1b1b1b"/>
      <text x="43" y="490" class="button" fill="#1b1b1b">Review conditions</text>
      <rect x="312" y="466" width="166" height="38" fill="#1b1b1b"/>
      <rect x="312" y="466" width="8" height="38" fill="#e24a2a"/>
      <text x="353" y="490" class="button" fill="#ffffff">Run profile</text>
    </g>

    <g transform="translate(28 684)">
      <text x="0" y="16" class="label" fill="#1b1b1b">SYSTEM</text>
      <text x="0" y="45" class="body" fill="#1b1b1b">Space Grotesk + IBM Plex Mono</text>
      <text x="0" y="69" class="caption" fill="#6e675c">Square geometry · 6/12px rhythm · sectional rules</text>
      <text x="0" y="103" class="label" fill="#1b1b1b">COLOR</text>
      <g transform="translate(0 114)">
        <rect width="52" height="28" fill="#f6f2ea" stroke="#1b1b1b"/><rect x="60" width="52" height="28" fill="#fffcf6" stroke="#1b1b1b"/><rect x="120" width="52" height="28" fill="#1b1b1b"/><rect x="180" width="52" height="28" fill="#6e675c"/><rect x="240" width="52" height="28" fill="#d2cabd"/><rect x="300" width="52" height="28" fill="#e24a2a"/>
      </g>
      <text x="0" y="181" class="label" fill="#1b1b1b">MOTION</text>
      <text x="0" y="207" class="caption" fill="#6e675c">100ms snap; section completion advances in discrete steps.</text>
      <text x="0" y="248" class="label" fill="#e24a2a">SIGNATURE · NUMBERED WORK RAIL</text>
      <text x="0" y="274" class="caption" fill="#6e675c">Accent marks the active operation within a visible sequence.</text>
