    <text x="28" y="86" class="title" fill="#1b1b1b">Constructive and legible</text>
    <text x="28" y="113" class="body" fill="#6e675c">Strong grouping, exposed sequence, decisive controls.</text>

    <g transform="translate(28 136)">
      <rect width="496" height="520" fill="#fffcf6" stroke="#1b1b1b"/>
      <rect width="496" height="48" fill="#1b1b1b"/>
      <text x="18" y="30" class="mono" fill="#ffffff">SIM / THERMAL / 0284</text>
      <rect x="398" y="12" width="80" height="24" fill="#e24a2a"/>
      <text x="414" y="28" class="label" fill="#ffffff">STABLE</text>

      <text x="18" y="84" class="mono" fill="#e24a2a">01 / DEFINE</text>
      <text x="18" y="119" class="title" fill="#1b1b1b">North chamber</text>
      <line x1="18" y1="136" x2="478" y2="136" stroke="#1b1b1b"/>

      <text x="18" y="169" class="label" fill="#1b1b1b">SOLVER</text>
      <rect x="18" y="180" width="224" height="44" fill="#fffcf6" stroke="#1b1b1b"/>
      <text x="31" y="207" class="body" fill="#1b1b1b">Adaptive mesh</text>
      <path d="M216 197 l7 7 7-7" fill="none" stroke="#1b1b1b" stroke-width="2"/>

      <text x="254" y="169" class="label" fill="#1b1b1b">TOLERANCE</text>
      <rect x="254" y="180" width="224" height="44" fill="#fffcf6" stroke="#1b1b1b"/>
      <text x="267" y="207" class="body" fill="#1b1b1b">0.0025 K</text>

      <text x="18" y="264" class="mono" fill="#e24a2a">02 / TUNE</text>
      <g transform="translate(18 278)">
        <rect width="460" height="40" fill="#fffcf6" stroke="#1b1b1b"/>
        <rect width="154" height="40" fill="#e24a2a"/>
        <text x="34" y="25" class="button" fill="#ffffff">Conservative</text>
        <line x1="154" y1="0" x2="154" y2="40" stroke="#1b1b1b"/>
        <line x1="307" y1="0" x2="307" y2="40" stroke="#1b1b1b"/>
        <text x="197" y="25" class="button" fill="#1b1b1b">Balanced</text>
        <text x="367" y="25" class="button" fill="#1b1b1b">Fast</text>
