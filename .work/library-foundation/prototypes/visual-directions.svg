        <rect width="452" height="42" rx="11" fill="#e8e6df"/>
        <rect x="3" y="3" width="146" height="36" rx="9" fill="#fbfaf7"/>
        <text x="44" y="26" class="button" fill="#006e5f">Conservative</text>
        <text x="191" y="26" class="button" fill="#74756d">Balanced</text>
        <text x="352" y="26" class="button" fill="#74756d">Fast</text>
      </g>

      <rect x="22" y="380" width="452" height="76" rx="10" fill="#fbfaf7"/>
      <circle cx="45" cy="403" r="6" fill="#006e5f"/>
      <text x="63" y="408" class="small" fill="#272823">Ready to solve</text>
      <text x="45" y="434" class="caption" fill="#74756d">Geometry is valid. Four boundary conditions are resolved.</text>

      <text x="22" y="493" class="button" fill="#006e5f">Review conditions</text>
      <rect x="327" y="468" width="147" height="42" rx="10" fill="#006e5f"/>
      <text x="365" y="494" class="button" fill="#ffffff">Run profile</text>
    </g>

    <g transform="translate(28 684)">
      <text x="0" y="16" class="label" fill="#4f514b">SYSTEM</text>
      <text x="0" y="45" class="body" fill="#272823">Source Sans 3 + tabular numerals</text>
      <text x="0" y="69" class="caption" fill="#74756d">8–14px geometry · 4/8px rhythm · layered fields</text>
      <text x="0" y="103" class="label" fill="#4f514b">COLOR</text>
      <g transform="translate(0 114)">
        <rect width="52" height="28" rx="7" fill="#fbfaf7" stroke="#dedcd4"/><rect x="60" width="52" height="28" rx="7" fill="#f2f0ea"/><rect x="120" width="52" height="28" rx="7" fill="#272823"/><rect x="180" width="52" height="28" rx="7" fill="#74756d"/><rect x="240" width="52" height="28" rx="7" fill="#dedcd4"/><rect x="300" width="52" height="28" rx="7" fill="#006e5f"/>
      </g>
      <text x="0" y="181" class="label" fill="#4f514b">MOTION</text>
      <text x="0" y="207" class="caption" fill="#74756d">160ms ease-out; surfaces settle without overshoot.</text>
      <text x="0" y="248" class="label" fill="#006e5f">SIGNATURE · ACCENT TINTED STATE SURFACE</text>
      <text x="0" y="274" class="caption" fill="#74756d">Accent appears as a quiet field around the current state.</text>
    </g>
